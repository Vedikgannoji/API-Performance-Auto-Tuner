[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autotuner*"]

[tool.setuptools.package-data]
autotuner = ["*.html", "*.js"]

[project]
name = "api-performance-auto-tuner"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.104.1,<1", "uvicorn>=0.24,<1", "pydantic>=2.5,<3"]

[project.scripts]
autotuner = "autotuner.cli:entrypoint"

[project.optional-dependencies]
test = ["pytest>=7.4,<9", "pytest-cov>=5,<8", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=autotuner --cov-branch --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=90"

